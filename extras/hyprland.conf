# Glass Arc on Hyprland. Add to your config:  source = ~/.config/hypr/zen-glass-arc.conf
# Zen draws its own see-through sidebar, so the window stays fully opaque:
# pages and video are not see-through, Hyprland only blurs behind the sidebar.
windowrule {
    name = glass-zen-browser
    match:class = ^(zen)$
    opacity = 1.0 override 1.0 override 1.0 override
}
